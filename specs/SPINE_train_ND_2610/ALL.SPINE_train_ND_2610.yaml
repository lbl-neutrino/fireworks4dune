default: &default
  ND_PRODUCTION_OUTDIR_BASE: '/pscratch/sd/d/dunepro/mkramer/output/SPINE_train_ND_2610'
  ND_PRODUCTION_LOGDIR_BASE: '/pscratch/sd/d/dunepro/mkramer/logs/SPINE_train_ND_2610'
  ND_PRODUCTION_RUNTIME: 'NONE'

apptainer: &apptainer
  <<: *default
  ND_PRODUCTION_RUNTIME: 'SINGULARITY'
  ND_PRODUCTION_APPTAINER_CACHEDIR: '/tmp/apptainer.mkramer'
  ND_PRODUCTION_APPTAINER_TMPDIR: '/tmp/apptainer.mkramer'
  ND_PRODUCTION_CONTAINER_DIR: '/pscratch/sd/d/dunepro/mkramer/containers'

edep_container: &edep_container
  <<: *apptainer
  ND_PRODUCTION_CONTAINER: 'sim2x2_ndlar012.sif'

spine_container: &spine_container
  <<: *apptainer
  ND_PRODUCTION_CONTAINER: 'larcv2_ub2204-cu124-torch251-larndsim.sif'

# ------------------------------------------------------------------------------

edep: &edep
  name: 'SPINE_train_ND_2610.edep'
  env:
    <<: *edep_container
    ND_PRODUCTION_SIM: 'BOMB'
    ND_PRODUCTION_NUM_EVENTS: '5'
    ND_PRODUCTION_EDEP_MAC: 'macros/dune-nd.bomb.mac'
    ND_PRODUCTION_GEOM_EDEP: 'geometry/nd_hall_with_lar_tms_sand_drift1_v2026.03.06.gdml'
    ND_PRODUCTION_MPVMPR_CONFIG: 'mpvmpr/mpvmpr_nd.yaml'

convert2h5: &convert2h5
  name: 'SPINE_train_ND_2610.convert2h5'
  env:
    <<: *edep_container
    ND_PRODUCTION_SINGLE_NAME: 'SPINE_train_ND_2610.edep'
    ND_PRODUCTION_ACTIVE_VOLUME: 'volTPCActive'
    ND_PRODUCTION_KEEP_ALL_DETS: '0'
    ND_PRODUCTION_IS_MPVMPR: '1'

larnd: &larnd
  name: 'SPINE_train_ND_2610.larnd'
  env:
    <<: *default
    ND_PRODUCTION_CONVERT2H5_NAME: 'SPINE_train_ND_2610.convert2h5'
    ND_PRODUCTION_COMPRESS: 'lzf'
    ND_PRODUCTION_LARNDSIM_CONFIG: 'ndlar_mpvmpr_ffe'

flow: &flow
  name: 'SPINE_train_ND_2610.flow'
  env:
    <<: *default
    ND_PRODUCTION_IN_NAME: 'SPINE_train_ND_2610.larnd'
    ND_PRODUCTION_COMPRESS: 'gzip'

flow2supera: &flow2supera
  name: 'SPINE_train_ND_2610.flow2supera'
  env:
    <<: *spine_container
    ND_PRODUCTION_IN_NAME: 'SPINE_train_ND_2610.flow'
    ND_PRODUCTION_FLOW2SUPERA_CONFIG: 'ndlar_mpvmpr'

# ------------------------------------------------------------------------------

base_envs:
  - *edep
  - *convert2h5
  - *larnd
  - *flow
  - *flow2supera
