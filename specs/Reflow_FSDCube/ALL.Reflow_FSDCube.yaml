default: &default
  ND_PRODUCTION_INDIR_BASE: '/dvs_ro/cfs/cdirs/dune/www/data/LBL/v3/FSDCube'
  ND_PRODUCTION_OUTDIR_BASE: '/pscratch/sd/d/dunepro/mkramer/output/Reflow_FSDCube_v3'
  ND_PRODUCTION_LOGDIR_BASE: '/pscratch/sd/d/dunepro/mkramer/logs/Reflow_FSDCube_v3'
  ND_PRODUCTION_RUNTIME: 'NONE'

shifter: &shifter
  <<: *default
  ND_PRODUCTION_RUNTIME: 'SHIFTER'

apptainer: &apptainer
  <<: *default
  ND_PRODUCTION_RUNTIME: 'SINGULARITY'
  ND_PRODUCTION_APPTAINER_CACHEDIR: '/tmp/apptainer.mkramer'
  ND_PRODUCTION_APPTAINER_TMPDIR: '/tmp/apptainer.mkramer'
  ND_PRODUCTION_CONTAINER_DIR: '/pscratch/sd/d/dunepro/mkramer/containers'

spine_container: &spine_container
  <<: *shifter
  ND_PRODUCTION_CONTAINER: 'deeplearnphysics/larcv2:ub2204-cu124-torch251-larndsim'
  ND_PRODUCTION_SPINE_NUM_THREADS: '1'
  ND_PRODUCTION_SPINE_OPENBLAS_NUM_THREADS: '1'

base_envs:
  - name: 'Reflow_FSDCube_v3.flow'
    env:
      <<: *default
      ND_PRODUCTION_FILE_BASIS: 'charge'
      ND_PRODUCTION_RUN_BINARY2PACKET: '1'
      ND_PRODUCTION_BINARY2PACKET_ARGS: '--block_size 4096'
      ND_PRODUCTION_COMPRESS: 'gzip'
      ND_PRODUCTION_CHARGE_EVB_WORKFLOWS:
        - 'yamls/fsdcube_flow/workflows/charge/charge_event_building_data.yaml'
      ND_PRODUCTION_CHARGE_RECO_WORKFLOWS:
        - 'yamls/fsdcube_flow/workflows/charge/charge_event_reconstruction_data.yaml'
        - 'yamls/fsdcube_flow/workflows/combined/combined_reconstruction_data.yaml'
        - 'yamls/fsdcube_flow/workflows/charge/prompt_calibration_data.yaml'

  - name: 'Reflow_FSDCube_v3.flow2supera'
    env:
      <<: *spine_container
      ND_PRODUCTION_IN_NAME: 'Reflow_FSDCUBE_v3.flow'
      ND_PRODUCTION_FLOW2SUPERA_CONFIG: 'fsd_data'

  - name: 'Reflow_FSDCube_v3.spine'
    env:
      <<: *spine_container
      ND_PRODUCTION_IN_NAME: 'Reflow_FSDCUBE_v3.flow2supera'
      ND_PRODUCTION_SPINE_CONFIG: 'install/spine-prod/config/infer/nd-lar/full_chain_260409.yaml'
