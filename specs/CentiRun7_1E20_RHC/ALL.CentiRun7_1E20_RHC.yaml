


default: &default
  ND_PRODUCTION_OUTDIR_BASE: '/pscratch/sd/d/dunepro/mkramer/output/CentiRun7_1E20_RHC'
  ND_PRODUCTION_LOGDIR_BASE: '/pscratch/sd/d/dunepro/mkramer/logs/CentiRun7_1E20_RHC'
  ND_PRODUCTION_RUNTIME: 'NONE'

shifter: &shifter
  <<: *default
  ND_PRODUCTION_RUNTIME: 'SHIFTER'

apptainer: &apptainer
  <<: *default
  ND_PRODUCTION_RUNTIME: 'SINGULARITY'
  ND_PRODUCTION_APPTAINER_CACHEDIR: '/tmp/apptainer.mkramer'
  ND_PRODUCTION_APPTAINER_TMPDIR: '/tmp/apptainer.mkramer'
  ND_PRODUCTION_CONTAINER_DIR: '/pscratch/sd/d/dunepro/mkramer/containers'

# ------------------------------------------------------------------------------ 

sl7_container: &sl7_container
  <<: *shifter
  ND_PRODUCTION_CONTAINER: 'fermilab/fnal-wn-sl7:latest'

al9_container: &al9_container
  <<: *shifter
  ND_PRODUCTION_CONTAINER: 'fermilab/fnal-wn-el9:9.7'

edep_container: &edep_container
  <<: *apptainer
  ND_PRODUCTION_CONTAINER: 'sim2x2_ndlar012.sif'

spine_container: &spine_container
  <<: *shifter
  ND_PRODUCTION_CONTAINER: 'deeplearnphysics/larcv2:ub2204-cu124-torch251-larndsim'
  ND_PRODUCTION_SPINE_NUM_THREADS: '1'
  ND_PRODUCTION_SPINE_OPENBLAS_NUM_THREADS: '1'

# ------------------------------------------------------------------------------ 

genie_common: &genie_common
  <<: *al9_container
  ND_PRODUCTION_DK2NU_DIR: '/dvs_ro/cfs/cdirs/dune/users/2x2EventGeneration/NuMI_dk2nu_2025/v03_02_RHC'
  ND_PRODUCTION_EXPOSURE: '1E15'
  ND_PRODUCTION_TUNE: 'AR23_20i_00_000'
  ND_PRODUCTION_XSEC_FILE: '/cvmfs/larsoft.opensciencegrid.org/products/genie_xsec/v3_06_00/NULL/AR2320i00000-k250-e1000/data/gxspl-NUsmall.xml'

edep_common: &edep_common
  <<: *edep_container
  ND_PRODUCTION_EDEP_MAC: 'macros/2x2_beam.mac'
  ND_PRODUCTION_GEOM_EDEP: 'geometry/Merged2x2MINERvA_v4/Merged2x2MINERvA_v4_withRock.gdml'

hadd_common: &hadd_common
  <<: *edep_container
  ND_PRODUCTION_HADD_FACTOR: '10'
  ND_PRODUCTION_USE_GHEP_POT: '1'

# ------------------------------------------------------------------------------

base_envs:

  - name: 'CentiRun7_1E20_RHC.genie.nu'
    env:
      <<: *genie_common
      ND_PRODUCTION_DET_LOCATION: 'MiniRun5-Nu'
      ND_PRODUCTION_GEOM: 'geometry/Merged2x2MINERvA_v4/Merged2x2MINERvA_v4_noRock.gdml'

  - name: 'CentiRun7_1E20_RHC.genie.rock'
    env:
      <<: *genie_common
      ND_PRODUCTION_DET_LOCATION: 'MiniRun5-Rock'
      ND_PRODUCTION_GEOM: 'geometry/Merged2x2MINERvA_v4/Merged2x2MINERvA_v4_justRock.gdml'
      ND_PRODUCTION_RUN_OFFSET: '1000000000'

  - name: 'CentiRun7_1E20_RHC.edep.nu'
    env:
      <<: *edep_common
      ND_PRODUCTION_GENIE_NAME: 'CentiRun7_1E20_RHC.genie.nu'

  - name: 'CentiRun7_1E20_RHC.edep.rock'
    env:
      <<: *edep_common
      ND_PRODUCTION_GENIE_NAME: 'CentiRun7_1E20_RHC.genie.rock'
      ND_PRODUCTION_RUN_OFFSET: '1000000000'

  - name: 'CentiRun7_1E20_RHC.edep.nu.hadd'
    env:
      <<: *hadd_common
      ND_PRODUCTION_IN_NAME: 'CentiRun7_1E20_RHC.edep.nu'

  - name: 'CentiRun7_1E20_RHC.edep.rock.hadd'
    env:
      <<: *hadd_common
      ND_PRODUCTION_IN_NAME: 'CentiRun7_1E20_RHC.edep.rock'

  - name: 'CentiRun7_1E20_RHC.spill'
    env:
      <<: *edep_container
      ND_PRODUCTION_SAMPLE_A_NAME: 'CentiRun7_1E20_RHC.edep.nu'
      ND_PRODUCTION_SAMPLE_A_POT: '1E16'
      ND_PRODUCTION_SAMPLE_B_NAME: 'CentiRun7_1E20_RHC.edep.rock'
      ND_PRODUCTION_SAMPLE_B_POT: '1E16'
      ND_PRODUCTION_REUSE_SAMPLE_B: '1'
      ND_PRODUCTION_SPILL_POT: '5E13'
      ND_PRODUCTION_SPILL_PERIOD: '1.2'
      ND_PRODUCTION_HADD_FACTOR: '10'
      ND_PRODUCTION_USE_GHEP_POT: '1'

  - name: 'CentiRun7_1E20_RHC.edep2flat'
    env:
      <<: *sl7_container
      ND_PRODUCTION_IN_NAME: 'CentiRun7_1E20_RHC.spill'

  - name: 'CentiRun7_1E20_RHC.minerva'
    env:
      <<: *sl7_container
      ND_PRODUCTION_IN_NAME: 'CentiRun7_1E20_RHC.edep2flat'

  - name: 'CentiRun7_1E20_RHC.convert2h5'
    env:
      <<: *edep_container
      ND_PRODUCTION_SPILL_NAME: 'CentiRun7_1E20_RHC.spill'
      ND_PRODUCTION_ACTIVE_VOLUME: 'volTPCActive'

  - name: 'CentiRun7_1E20_RHC.larnd'
    env:
      <<: *default
      ND_PRODUCTION_CONVERT2H5_NAME: 'CentiRun7_1E20_RHC.convert2h5'
      ND_PRODUCTION_LARNDSIM_CONFIG: '2x2'
      ND_PRODUCTION_COMPRESS: 'lzf'

  - name: 'CentiRun7_1E20_RHC.flow'
    env:
      <<: *default
      ND_PRODUCTION_IN_NAME: 'CentiRun7_1E20_RHC.larnd'
      ND_PRODUCTION_COMPRESS: 'gzip'

  - name: 'CentiRun7_1E20_RHC.flow2supera'
    env:
      <<: *spine_container
      ND_PRODUCTION_IN_NAME: 'CentiRun7_1E20_RHC.flow'

  - name: 'CentiRun7_1E20_RHC.spine'
    env:
      <<: *spine_container
      ND_PRODUCTION_IN_NAME: 'CentiRun7_1E20_RHC.flow2supera'

  - name: 'CentiRun7_1E20_RHC.flow2root'
    env:
      <<: *sl7_container
      ND_PRODUCTION_IN_NAME: 'CentiRun7_1E20_RHC.flow'

  - name: 'CentiRun7_1E20_RHC.pandora'
    env:
      <<: *sl7_container
      ND_PRODUCTION_IN_NAME: 'CentiRun7_1E20_RHC.flow2root'

  - name: 'CentiRun7_1E20_RHC.caf'
    env:
      <<: *sl7_container
      ND_PRODUCTION_GHEP_NU_NAME: 'CentiRun7_1E20_RHC.genie.nu'
      ND_PRODUCTION_GHEP_ROCK_NAME: 'CentiRun7_1E20_RHC.genie.rock'
      ND_PRODUCTION_MINERVA_NAME: 'CentiRun7_1E20_RHC.minerva'
      ND_PRODUCTION_SPINE_NAME: 'CentiRun7_1E20_RHC.spine'
      ND_PRODUCTION_SPILL_NAME: 'CentiRun7_1E20_RHC.spill'
      ND_PRODUCTION_PANDORA_NAME: 'CentiRun7_1E20_RHC.pandora'
